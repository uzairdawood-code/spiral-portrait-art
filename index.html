<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spiral Portrait Animation</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: black;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="800"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = 'image_2d82c0.jpg';

        img.onload = function() {
            // Draw image to canvas to sample pixel data
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let theta = 0;
            const maxTheta = 60 * 2 * Math.PI;
            const step = 0.4;
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const a = 2.0;

            function animate() {
                let batchEnd = Math.min(theta + 30, maxTheta);
                while (theta < batchEnd) {
                    let r = a * theta;
                    let x = cx + r * Math.cos(theta);
                    let y = cy + r * Math.sin(theta);

                    let ix = Math.floor(x);
                    let iy = Math.floor(y);

                    if (ix >= 0 && ix < canvas.width && iy >= 0 && iy < canvas.height) {
                        let index = (iy * canvas.width + ix) * 4;
                        let r_val = imgData.data[index];
                        let g_val = imgData.data[index + 1];
                        let b_val = imgData.data[index + 2];
                        let brightness = (r_val + g_val + b_val) / 3;

                        // Draw dots based on image brightness
                        let size = Math.max(1, Math.floor((255 - brightness) / 50));
                        ctx.fillStyle = `rgb(${r_val}, ${g_val}, ${b_val})`;
                        ctx.fillRect(x, y, size, size);
                    }
                    theta += step;
                }

                if (theta < maxTheta) {
                    requestAnimationFrame(animate);
                }
            }
            animate();
        };
    </script>
</body>
</html>
