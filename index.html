<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spiral Portrait Art</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            color: #fff;
        }
        #upload-container {
            position: absolute;
            top: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }
        input[type="file"] {
            color: #fff;
        }
        canvas {
            background-color: #000;
        }
    </style>
</head>
<body>
    <div id="upload-container">
        <label>Select Image if blank: </label>
        <input type="file" id="imageLoader" accept="image/*">
    </div>
    <canvas id="canvas" width="800" height="800"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const imageLoader = document.getElementById('imageLoader');

        function processImage(img) {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const hRatio = canvas.width / img.width;
            const vRatio = canvas.height / img.height;
            const ratio = Math.min(hRatio, vRatio);
            const centerShiftX = (canvas.width - img.width * ratio) / 2;
            const centerShiftY = (canvas.height - img.height * ratio) / 2;

            ctx.drawImage(img, 0, 0, img.width, img.height, 
                               centerShiftX, centerShiftY, img.width * ratio, img.height * ratio);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let theta = 0;
            const maxTheta = 80 * 2 * Math.PI;
            const step = 0.25;
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const a = 1.5;

            function animate() {
                let batchEnd = Math.min(theta + 80, maxTheta);
                while (theta < batchEnd) {
                    let r = a * theta;
                    let x = cx + r * Math.cos(theta);
                    let y = cy + r * Math.sin(theta);

                    let ix = Math.floor(x);
                    let iy = Math.floor(y);

                    if (ix >= 0 && ix < canvas.width && iy >= 0 && iy < canvas.height) {
                        let index = (iy * canvas.width + ix) * 4;
                        let r_val = imgData.data[index];
                        let g_val = imgData.data[index + 1];
                        let b_val = imgData.data[index + 2];
                        let brightness = (r_val * 0.299 + g_val * 0.587 + b_val * 0.114);

                        if (brightness < 240) {
                            let size = Math.max(1, Math.floor((255 - brightness) / 35));
                            ctx.fillStyle = `rgb(${r_val}, ${g_val}, ${b_val})`;
                            ctx.fillRect(x - size/2, y - size/2, size, size);
                        }
                    }
                    theta += step;
                }

                if (theta < maxTheta) {
                    requestAnimationFrame(animate);
                }
            }
            animate();
        }

        // Try loading default repo image automatically
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = 'image_2d82c0.jpg';
        img.onload = function() {
            processImage(img);
        };

        // Fallback or manual upload handler
        imageLoader.addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const userImg = new Image();
                userImg.onload = function() {
                    processImage(userImg);
                }
                userImg.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        });
    </script>
</body>
</html>
